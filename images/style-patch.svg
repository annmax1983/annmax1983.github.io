<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400">
  <rect width="640" height="400" fill="#12121a" rx="12"/>
  <rect x="20" y="20" width="600" height="360" fill="#1a1a2e" rx="10" stroke="#2a2a40" stroke-width="1"/>
  <!-- Title bar -->
  <rect x="20" y="20" width="600" height="40" fill="#16162a" rx="10"/>
  <rect x="20" y="45" width="600" height="1" fill="#2a2a40"/>
  <circle cx="42" cy="40" r="5" fill="#ff5f57"/>
  <circle cx="58" cy="40" r="5" fill="#febc2e"/>
  <circle cx="74" cy="40" r="5" fill="#28c840"/>
  <text x="320" y="45" text-anchor="middle" fill="#8888a0" font-family="system-ui" font-size="12">StylePatch — Style Customizer</text>
  <!-- Left panel - controls -->
  <rect x="40" y="75" width="200" height="280" fill="#16162a" rx="8"/>
  <text x="55" y="100" fill="#e8e8f0" font-family="system-ui" font-size="12" font-weight="600">🎨 Style Settings</text>
  <!-- Background color -->
  <text x="55" y="130" fill="#8888a0" font-family="system-ui" font-size="10">Background Color</text>
  <rect x="55" y="138" width="100" height="24" fill="#1a1033" rx="4" stroke="#3a3a55" stroke-width="1"/>
  <text x="165" y="155" fill="#8888a0" font-family="system-ui" font-size="9">#1a1033</text>
  <!-- Text color -->
  <text x="55" y="180" fill="#8888a0" font-family="system-ui" font-size="10">Text Color</text>
  <rect x="55" y="188" width="100" height="24" fill="#e8e8f0" rx="4"/>
  <text x="165" y="205" fill="#8888a0" font-family="system-ui" font-size="9">#e8e8f0</text>
  <!-- Font size -->
  <text x="55" y="230" fill="#8888a0" font-family="system-ui" font-size="10">Font Size</text>
  <rect x="55" y="238" width="160" height="4" fill="#2a2a40" rx="2"/>
  <rect x="55" y="238" width="100" height="4" fill="#6366f1" rx="2"/>
  <circle cx="155" cy="240" r="6" fill="#8b5cf6"/>
  <text x="55" y="262" fill="#8888a0" font-family="system-ui" font-size="9">120%</text>
  <!-- Presets -->
  <text x="55" y="285" fill="#8888a0" font-family="system-ui" font-size="10">Presets</text>
  <rect x="55" y="293" width="45" height="24" fill="#f5f5dc" rx="4"/>
  <text x="77" y="310" text-anchor="middle" fill="#333" font-family="system-ui" font-size="8">Light</text>
  <rect x="105" y="293" width="45" height="24" fill="#3a2a1a" rx="4"/>
  <text x="127" y="310" text-anchor="middle" fill="#ddd" font-family="system-ui" font-size="8">Warm</text>
  <rect x="155" y="293" width="45" height="24" fill="#1a3a2a" rx="4"/>
  <text x="177" y="310" text-anchor="middle" fill="#ddd" font-family="system-ui" font-size="8">Green</text>
  <!-- Apply button -->
  <rect x="55" y="325" width="160" height="28" fill="#6366f1" rx="6"/>
  <text x="135" y="344" text-anchor="middle" fill="#fff" font-family="system-ui" font-size="10" font-weight="600">Apply & Save</text>
  <!-- Right panel - preview -->
  <rect x="260" y="75" width="340" height="280" fill="#1a1033" rx="8"/>
  <text x="280" y="100" fill="#e8e8f0" font-family="system-ui" font-size="11" font-weight="600">Page Preview</text>
  <text x="280" y="120" fill="#e8e8f0" font-family="system-ui" font-size="9">Lorem ipsum dolor sit amet, consectetur adipiscing elit.</text>
  <text x="280" y="136" fill="#e8e8f0" font-family="system-ui" font-size="9">Sed do eiusmod tempor incididunt ut labore et dolore magna.</text>
  <rect x="280" y="150" width="200" height="8" fill="#2a2a40" rx="4"/>
  <rect x="280" y="150" width="140" height="8" fill="#6366f1" rx="4"/>
  <text x="280" y="180" fill="#8b5cf6" font-family="system-ui" font-size="9" text-decoration="underline">Link color example</text>
  <rect x="280" y="195" width="280" height="60" fill="#16162a" rx="4" stroke="#2a2a40" stroke-width="1"/>
  <text x="295" y="212" fill="#e8e8f0" font-family="system-ui" font-size="9">Card component with custom styling</text>
  <text x="295" y="228" fill="#8888a0" font-family="system-ui" font-size="8">Background, text, and link colors all customized</text>
  <!-- Toggle -->
  <text x="280" y="280" fill="#8888a0" font-family="system-ui" font-size="10">Global: OFF</text>
  <rect x="350" y="270" width="36" height="18" fill="#2a2a40" rx="9"/>
  <circle cx="359" cy="279" r="7" fill="#555570"/>
</svg>
