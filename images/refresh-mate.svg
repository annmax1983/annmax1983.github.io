<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400">
  <rect width="640" height="400" fill="#12121a" rx="12"/>
  <rect x="20" y="20" width="600" height="360" fill="#1a1a2e" rx="10" stroke="#2a2a40" stroke-width="1"/>
  <!-- Title bar -->
  <rect x="20" y="20" width="600" height="40" fill="#16162a" rx="10"/>
  <rect x="20" y="45" width="600" height="1" fill="#2a2a40"/>
  <circle cx="42" cy="40" r="5" fill="#ff5f57"/>
  <circle cx="58" cy="40" r="5" fill="#febc2e"/>
  <circle cx="74" cy="40" r="5" fill="#28c840"/>
  <text x="320" y="45" text-anchor="middle" fill="#8888a0" font-family="system-ui" font-size="12">RefreshMate — Auto Page Refresh</text>
  <!-- URL bar -->
  <rect x="40" y="75" width="520" height="32" fill="#16162a" rx="6" stroke="#2a2a40" stroke-width="1"/>
  <text x="55" y="96" fill="#555570" font-family="system-ui" font-size="10">https://example.com/product-page</text>
  <!-- Refresh interval -->
  <rect x="40" y="125" width="250" height="100" fill="#16162a" rx="8"/>
  <text x="55" y="148" fill="#e8e8f0" font-family="system-ui" font-size="11" font-weight="600">⏱️ Refresh Interval</text>
  <rect x="55" y="158" width="50" height="24" fill="#6366f1" rx="4"/>
  <text x="80" y="175" text-anchor="middle" fill="#fff" font-family="system-ui" font-size="9">5s</text>
  <rect x="110" y="158" width="50" height="24" fill="#2a2a40" rx="4" stroke="#3a3a55" stroke-width="1"/>
  <text x="135" y="175" text-anchor="middle" fill="#8888a0" font-family="system-ui" font-size="9">30s</text>
  <rect x="165" y="158" width="50" height="24" fill="#2a2a40" rx="4" stroke="#3a3a55" stroke-width="1"/>
  <text x="190" y="175" text-anchor="middle" fill="#8888a0" font-family="system-ui" font-size="9">1min</text>
  <rect x="55" y="188" width="80" height="24" fill="#2a2a40" rx="4" stroke="#3a3a55" stroke-width="1"/>
  <text x="95" y="205" text-anchor="middle" fill="#8888a0" font-family="system-ui" font-size="9">Custom</text>
  <text x="150" y="205" fill="#555570" font-family="system-ui" font-size="8">🎲 Random: 10-60s</text>
  <!-- Keyword monitor -->
  <rect x="310" y="125" width="250" height="100" fill="#16162a" rx="8"/>
  <text x="325" y="148" fill="#e8e8f0" font-family="system-ui" font-size="11" font-weight="600">🔔 Keyword Alert</text>
  <rect x="325" y="158" width="220" height="24" fill="#2a2a40" rx="4" stroke="#3a3a55" stroke-width="1"/>
  <text x="335" y="175" fill="#555570" font-family="system-ui" font-size="9">Add keyword to watch...</text>
  <rect x="325" y="188" width="100" height="24" fill="#28c84020" rx="4"/>
  <text x="375" y="205" text-anchor="middle" fill="#28c840" font-family="system-ui" font-size="8">● Monitoring</text>
  <rect x="435" y="188" width="110" height="24" fill="#2a2a40" rx="4" stroke="#3a3a55" stroke-width="1"/>
  <text x="490" y="205" text-anchor="middle" fill="#8888a0" font-family="system-ui" font-size="8">Auto-Pause ⌨️</text>
  <!-- Status bar -->
  <rect x="40" y="240" width="520" height="45" fill="#16162a" rx="8"/>
  <text x="55" y="260" fill="#28c840" font-family="system-ui" font-size="10">● Refreshing</text>
  <text x="160" y="260" fill="#8888a0" font-family="system-ui" font-size="10">Next: 23s</text>
  <text x="260" y="260" fill="#8888a0" font-family="system-ui" font-size="10">Count: 47</text>
  <rect x="55" y="268" width="200" height="4" fill="#2a2a40" rx="2"/>
  <rect x="55" y="268" width="80" height="4" fill="#6366f1" rx="2"/>
  <!-- CAPTCHA detection -->
  <rect x="40" y="300" width="250" height="40" fill="#ff5f5710" rx="8" stroke="#ff5f5730" stroke-width="1"/>
  <text x="55" y="325" fill="#ff5f57" font-family="system-ui" font-size="10">⚠️ CAPTCHA Detected — Auto Stopped</text>
  <!-- Export/Import -->
  <rect x="310" y="300" width="120" height="36" fill="#2a2a40" rx="6" stroke="#3a3a55" stroke-width="1"/>
  <text x="370" y="323" text-anchor="middle" fill="#8888a0" font-family="system-ui" font-size="9">📤 Export JSON</text>
  <rect x="440" y="300" width="120" height="36" fill="#2a2a40" rx="6" stroke="#3a3a55" stroke-width="1"/>
  <text x="500" y="323" text-anchor="middle" fill="#8888a0" font-family="system-ui" font-size="9">📥 Import JSON</text>
</svg>
