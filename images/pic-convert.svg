<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400">
  <rect width="640" height="400" fill="#12121a" rx="12"/>
  <rect x="20" y="20" width="600" height="360" fill="#1a1a2e" rx="10" stroke="#2a2a40" stroke-width="1"/>
  <!-- Title bar -->
  <rect x="20" y="20" width="600" height="40" fill="#16162a" rx="10"/>
  <rect x="20" y="45" width="600" height="1" fill="#2a2a40"/>
  <circle cx="42" cy="40" r="5" fill="#ff5f57"/>
  <circle cx="58" cy="40" r="5" fill="#febc2e"/>
  <circle cx="74" cy="40" r="5" fill="#28c840"/>
  <text x="320" y="45" text-anchor="middle" fill="#8888a0" font-family="system-ui" font-size="12">ImageConv — Image Format Converter</text>
  <!-- Content area -->
  <rect x="40" y="80" width="180" height="120" fill="#1e1e36" rx="8" stroke="#3a3a55" stroke-width="1" stroke-dasharray="4"/>
  <text x="130" y="140" text-anchor="middle" fill="#555570" font-family="system-ui" font-size="11">Drag & Drop Image</text>
  <text x="130" y="156" text-anchor="middle" fill="#444460" font-family="system-ui" font-size="9">PNG / JPG / WEBP / AVIF</text>
  <!-- Arrow -->
  <text x="255" y="145" text-anchor="middle" fill="#6366f1" font-family="system-ui" font-size="24">→</text>
  <!-- Format buttons -->
  <rect x="300" y="85" width="80" height="30" fill="#6366f1" rx="6"/>
  <text x="340" y="105" text-anchor="middle" fill="#fff" font-family="system-ui" font-size="11" font-weight="600">PNG</text>
  <rect x="390" y="85" width="80" height="30" fill="#2a2a40" rx="6" stroke="#3a3a55" stroke-width="1"/>
  <text x="430" y="105" text-anchor="middle" fill="#8888a0" font-family="system-ui" font-size="11">JPG</text>
  <rect x="300" y="125" width="80" height="30" fill="#2a2a40" rx="6" stroke="#3a3a55" stroke-width="1"/>
  <text x="340" y="145" text-anchor="middle" fill="#8888a0" font-family="system-ui" font-size="11">WEBP</text>
  <rect x="390" y="125" width="80" height="30" fill="#2a2a40" rx="6" stroke="#3a3a55" stroke-width="1"/>
  <text x="430" y="145" text-anchor="middle" fill="#8888a0" font-family="system-ui" font-size="11">AVIF</text>
  <!-- Quality slider -->
  <text x="300" y="180" fill="#8888a0" font-family="system-ui" font-size="10">Quality: 85%</text>
  <rect x="300" y="190" width="200" height="4" fill="#2a2a40" rx="2"/>
  <rect x="300" y="190" width="170" height="4" fill="#6366f1" rx="2"/>
  <circle cx="470" cy="192" r="6" fill="#8b5cf6"/>
  <!-- Size comparison -->
  <rect x="40" y="220" width="480" height="50" fill="#16162a" rx="8"/>
  <text x="60" y="242" fill="#8888a0" font-family="system-ui" font-size="10">Original: 2.4 MB (PNG)</text>
  <text x="60" y="258" fill="#28c840" font-family="system-ui" font-size="10">Converted: 380 KB (WEBP) — 84% smaller</text>
  <!-- Action buttons -->
  <rect x="40" y="290" width="120" height="36" fill="#6366f1" rx="8"/>
  <text x="100" y="313" text-anchor="middle" fill="#fff" font-family="system-ui" font-size="11" font-weight="600">💾 Save File</text>
  <rect x="170" y="290" width="120" height="36" fill="#2a2a40" rx="8" stroke="#3a3a55" stroke-width="1"/>
  <text x="230" y="313" text-anchor="middle" fill="#8888a0" font-family="system-ui" font-size="11">📋 Copy</text>
</svg>
