<!DOCTYPE html>
<html>
<head><title>Favicon & OG Generator</title></head>
<body style="background:#1a1a2e;color:#e8e8f0;font-family:system-ui;padding:40px">
<h2>🎨 Favicon & OG Image Generator</h2>
<p>Click buttons to download PNG files, then copy to <code>images/</code> or project root.</p>

<h3>Preview</h3>
<canvas id="canvas" style="border:1px solid #333;border-radius:8px"></canvas>

<br><br>
<button onclick="generateFavicon()" style="padding:12px 24px;background:#6366f1;color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:14px">⬇ Download favicon.png (32×32)</button>
<button onclick="generateFavicon64()" style="padding:12px 24px;background:#8b5cf6;color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:14px">⬇ Download favicon-64.png (64×64)</button>
<button onclick="generateAppleTouch()" style="padding:12px 24px;background:#a855f7;color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:14px">⬇ Download apple-touch-icon.png (180×180)</button>

<br><br>
<button onclick="generateOG()" style="padding:12px 24px;background:linear-gradient(135deg,#06b6d4,#3b82f6,#6366f1);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:14px">⬇ Download og-cover.png (1200×630)</button>

<script>
function drawFavicon(size) {
  const canvas = document.getElementById('canvas');
  canvas.width = size; canvas.height = size;
  const ctx = canvas.getContext('2d');
  const s = size / 64; // scale factor

  // Background gradient
  const bgGrad = ctx.createLinearGradient(0, 0, size, size);
  bgGrad.addColorStop(0, '#4f46e5');
  bgGrad.addColorStop(0.5, '#7c3aed');
  bgGrad.addColorStop(1, '#a855f7');

  // Rounded rect
  const r = 14 * s;
  ctx.beginPath();
  ctx.roundRect(0, 0, size, size, r);
  ctx.fillStyle = bgGrad;
  ctx.fill();

  // Inner border
  ctx.beginPath();
  ctx.roundRect(2*s, 2*s, size-4*s, size-4*s, 12*s);
  ctx.strokeStyle = 'rgba(255,255,255,0.15)';
  ctx.lineWidth = 1*s;
  ctx.stroke();

  // Lightning bolt - golden gradient
  const boltGrad = ctx.createLinearGradient(20*s, 8*s, 44*s, 56*s);
  boltGrad.addColorStop(0, '#fbbf24');
  boltGrad.addColorStop(1, '#f59e0b');

  ctx.save();
  ctx.beginPath();
  // ⚡ shape
  ctx.moveTo(34*s, 8*s);
  ctx.lineTo(24*s, 32*s);
  ctx.lineTo(32*s, 32*s);
  ctx.lineTo(28*s, 56*s);
  ctx.lineTo(44*s, 28*s);
  ctx.lineTo(35*s, 28*s);
  ctx.lineTo(40*s, 8*s);
  ctx.closePath();

  // Glow effect
  ctx.shadowColor = '#fbbf24';
  ctx.shadowBlur = 6*s;
  ctx.fillStyle = boltGrad;
  ctx.fill();
  ctx.restore();

  // Highlight overlay
  ctx.save();
  ctx.globalAlpha = 0.25;
  ctx.beginPath();
  ctx.moveTo(34*s, 8*s);
  ctx.lineTo(24*s, 32*s);
  ctx.lineTo(32*s, 32*s);
  ctx.lineTo(28*s, 56*s);
  ctx.lineTo(44*s, 28*s);
  ctx.lineTo(35*s, 28*s);
  ctx.lineTo(40*s, 8*s);
  ctx.closePath();
  ctx.fillStyle = '#fff';
  ctx.fill();
  ctx.restore();

  return canvas;
}

function download(canvas, filename) {
  const link = document.createElement('a');
  link.download = filename;
  link.href = canvas.toDataURL('image/png');
  link.click();
}

function generateFavicon() {
  download(drawFavicon(32), 'favicon.png');
}

function generateFavicon64() {
  download(drawFavicon(64), 'favicon-64.png');
}

function generateAppleTouch() {
  download(drawFavicon(180), 'apple-touch-icon.png');
}

function generateOG() {
  const canvas = document.getElementById('canvas');
  canvas.width = 1200; canvas.height = 630;
  const ctx = canvas.getContext('2d');

  // Background
  const grad = ctx.createLinearGradient(0, 0, 1200, 630);
  grad.addColorStop(0, '#0a0a0f');
  grad.addColorStop(0.5, '#1a1033');
  grad.addColorStop(1, '#0a0a0f');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, 1200, 630);

  // Grid lines
  ctx.strokeStyle = 'rgba(99,102,241,0.04)';
  ctx.lineWidth = 1;
  for (let x = 0; x < 1200; x += 60) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,630); ctx.stroke(); }
  for (let y = 0; y < 630; y += 60) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(1200,y); ctx.stroke(); }

  // Glow circles
  ctx.fillStyle = 'rgba(99,102,241,0.06)';
  ctx.beginPath(); ctx.arc(900, 100, 250, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = 'rgba(139,92,246,0.05)';
  ctx.beginPath(); ctx.arc(300, 500, 200, 0, Math.PI*2); ctx.fill();

  // Title gradient
  const titleGrad = ctx.createLinearGradient(300, 0, 900, 0);
  titleGrad.addColorStop(0, '#6366f1');
  titleGrad.addColorStop(0.5, '#8b5cf6');
  titleGrad.addColorStop(1, '#a78bfa');

  // ⚡ icon
  ctx.fillStyle = '#fbbf24';
  ctx.font = 'bold 48px system-ui';
  ctx.textAlign = 'center';
  ctx.fillText('⚡', 600, 170);

  // AnnMax
  ctx.fillStyle = titleGrad;
  ctx.font = 'bold 72px system-ui, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('AnnMax', 600, 250);

  // Separator
  const lineGrad = ctx.createLinearGradient(400, 0, 800, 0);
  lineGrad.addColorStop(0, 'transparent');
  lineGrad.addColorStop(0.5, 'rgba(99,102,241,0.3)');
  lineGrad.addColorStop(1, 'transparent');
  ctx.strokeStyle = lineGrad;
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(350, 270); ctx.lineTo(850, 270); ctx.stroke();

  // Subtitle
  ctx.fillStyle = '#a78bfa';
  ctx.font = '600 24px system-ui, sans-serif';
  ctx.fillText('Full-Stack Developer · Browser Extension Developer', 600, 310);

  // Desc
  ctx.fillStyle = '#8888a0';
  ctx.font = '18px system-ui, sans-serif';
  ctx.fillText('18 Years of Coding · 9 Browser Extensions · Privacy-First', 600, 350);

  // Extension icons
  const icons = ['🖼️','📸','🎨','📦','🔓','🔐','📊','🔤','🎯'];
  const startX = 180;
  icons.forEach((icon, i) => {
    const x = startX + i * 100;
    // Card bg
    ctx.fillStyle = 'rgba(255,255,255,0.03)';
    ctx.beginPath(); ctx.roundRect(x, 400, 80, 80, 16); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.06)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.roundRect(x, 400, 80, 80, 16); ctx.stroke();
    // Icon
    ctx.font = '28px system-ui';
    ctx.textAlign = 'center';
    ctx.fillText(icon, x+40, 448);
  });

  // Tagline
  ctx.fillStyle = '#555570';
  ctx.font = '14px system-ui, sans-serif';
  ctx.fillText('Lightweight · Privacy-First · 100% Local · MV3 · Zero Tracking', 600, 530);

  // GitHub
  ctx.fillStyle = '#6366f1';
  ctx.font = '600 14px system-ui, sans-serif';
  ctx.fillText('github.com/annmax1983', 600, 580);

  download(canvas, 'og-cover.png');
}

// Auto-preview
drawFavicon(128);
</script>
</body>
</html>
